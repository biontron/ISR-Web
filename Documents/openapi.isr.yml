# basicAuth with bearerAuth
openapi: 3.0.0
info:
  title: infrastruktur Repository (ISR) API
  description: API-Spezifikation generiert aus dem RESTer Export.
  version: "1.0"
servers:
  - url: https://isr.biontron.com/api/{domain}
    variables:
      domain:
        default: "demo"
        description: "Die Domain, unter der die API verfügbar ist."

  - url: https://infrastrukturrepository.io/v1/{domain}
    variables:
      domain:
        default: "demo"
        description: "Die Domain, unter der die API verfügbar ist."
paths:
  /login:
    post:
      summary: User Login
      operationId: login
      tags:
        - Access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "Mr. X"
                password:
                  type: string
                  example: "S****-M****-0**"
      responses:
        '200':
          description: Erfolgreiche Anmeldung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"    
  /logout:
    get:
      summary: User Logout
      operationId: logout
      tags:
        - Access
      responses:
        '200':
          description: Erfolgreiche Abmeldung

  /views:
    get:
      summary: List all views
      tags:
        - View
      parameters:
        - name: Authorization
          in: header
          required: true
          description: The JWT (prefix Baerer; received as response of /login)
          schema:
            type: string
      operationId: listViews
      responses:
        200:
          description: An array of views
          content:
            application/json:    
              schema:
                $ref: "#/components/schemas/ViewItem"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - basicAuth: []
    post:
      summary: Create a view
      operationId: createView
      tags:
        - View
      parameters:
        - name: Authorization
          in: header
          required: true
          description: The JWT (prefix Baerer; received as response of /login)
          schema:
            type: string
      responses:
        201:
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - basicAuth: []
  /views/{viewId}:
    get:
      summary: Read view details
      operationId: readView
      tags:
        - View
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
        - name: viewId
          in: path
          required: true
          description: The id of the view to retrieve
          schema:
            type: string
            default: 01v93fa0-1c74-44b1-bafd-6d8a988fea04
      responses:
        200:
