      security:
        - basicAuth: []
    delete:
      summary: Delete a view
      operationId: deleteView
      tags:
        - View
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string

        - name: viewId
          in: path
          required: true
          description: The id of the view to delete
          schema:
            type: string
      responses:
        201:
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - basicAuth: []
