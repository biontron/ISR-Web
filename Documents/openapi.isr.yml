components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      description: Basic Auth (Base64), erhalten über /login
      schema:
        type: string
    SchemaIdPath:
      name: schemaId
      in: path
      required: true
      description: Schema-ID (z. B. SCHEMA, DEVICE, IPV4)
      schema:
        type: string
        example: SCHEMA

  responses:
    UnexpectedError:
      description: unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  examples:
    SchemaMetaSchema:
      summary: Meta-Schema SCHEMA (INTERNAL)
      description: >
        Selbstbeschreibende Formular-Definition für den Schema Manager.
        Im REST-Payload kann style.treeIcon SVG-Markup enthalten (Beispiel gekürzt).
      externalValue: examples/SCHEMA.json
    SchemaMetaSchemaList:
      summary: Internal-Schema-Liste mit Meta-Schema SCHEMA
      externalValue: examples/SCHEMA-list.json

  schemas:
    AnyType:
      anyOf:
        - type: string
        - type: number
        - type: integer
        - type: boolean
        - type: array
          items: {}
        - type: object
      description: Any kind of data

    AssetItem:
      required:
        - id
        - xxx
      properties:
        id:
          type: integer
          format: int64
        xxx:
          type: string

    AssetList:
      type: array
      items:
        $ref: "#/components/schemas/AssetItem"

    AttachmentType:
      required:
        - id
        - xxx
      properties:
        id:
          type: integer
          format: int64
        xxx:
          type: string

    CollectionItem:
      required:
        - id
        - xxx
      properties:
        id:
          type: integer
          format: int64
        xxx:
          type: string

    CollectionList:
      type: array
      items:
        $ref: "#/components/schemas/CollectionItem"

    ConnectionItem:
      required:
        - id
        - xxx
      properties:
        id:
          type: integer
          format: int64
        xxx:
          type: string

    ConnectionList:
      type: array
      items:
        $ref: "#/components/schemas/ConnectionItem"

    DefinitionType:
      type: object
      required:
        - baseType
        - subType
        - name
        - description
      properties:
        baseType:
          type: string
          example: "ELEMENT"
        type:
          type: string
          example: "VIEW"
        subType:
          type: string
          example: ""
        name:
          type: string
        description:
          type: string

    DocumentItem:
      required:
        - id
        - xxx
      properties:
        id:
          type: integer
          format: int64
        xxx:
          type: string

    DocumentList:
      type: array
      items:
        $ref: "#/components/schemas/DocumentItem"

    ElementRefType:
      required:
        - id
        - xxx
      properties:
        id:
          type: integer
          format: int64
        xxx:
          type: string

    EnvironmentItem:
      required:
        - id
        - definition
        - properties
      properties:
        id:
          type: string
          example: "01e93fa0-1c74-44b1-bafd-6d8a988fea0"
        definition:
          $ref: "#/components/schemas/DefinitionType"
        properties:
          type: object
          required:
            - responsibles
            - notaions
          properties:
            responsibles:
              type: array
              items:
                $ref: "#/components/schemas/ResponsibleType"
            notations:
              type: array
              items:
                $ref: "#/components/schemas/NotationType"

    EnvironmentList:
      type: array
      items:
        $ref: "#/components/schemas/EnvironmentItem"



    MultilingualTextType:
      type: object
      description: Sprachcode → Text (ISO 639; „und“ = sprachneutral)
      additionalProperties:
        type: string
      example:
        und: SchemaEditor Schema
        de: SchemaEditor Schema

    SchemaBaseType:
      type: string
      enum:
        - INTERNAL
        - ELEMENT
        - DOCKPART

    SchemaDataType:
      type: string
      enum:
        - string
        - number
        - boolean
        - "null"
        - object
        - array
      description: Datentyp eines Schema-Feldes (fieldType)

    SchemaFieldFlagsType:
      type: object
      properties:
        readonly:
          type: boolean
        hidden:
          type: boolean
        nullable:
          type: boolean
      required:
        - readonly
        - hidden
        - nullable

    SchemaGroupFlags:
      type: object
      properties:
        readonly:
          type: boolean
        hidden:
          type: boolean
      required:
        - readonly
        - hidden

    SchemaField:
      type: object
      description: Feld-Definition innerhalb eines Schema-Dokuments (kind=field)
      required:
        - kind
        - order
        - dataStructure
        - formProperties
        - fieldType
        - itemFlags
        - minUsage
        - maxUsage
      properties:
        kind:
          type: string
          enum:
            - field
        order:
          type: number
        dataStructure:
          type: object
          required:
            - itemName
          properties:
            itemName:
              type: string
              description: JSON-Pfad-Segment / Eigenschaftsname in Instanzdaten
            default:
              type: string
            nullable:
              type: boolean
        formProperties:
          type: object
          required:
            - label
          properties:
            label:
              $ref: "#/components/schemas/MultilingualTextType"
        fieldType:
          $ref: "#/components/schemas/SchemaDataType"
        rules:
          type: string
          description: Validierungs-Pattern (RegExp)
        example:
          type: string
        itemFlags:
          $ref: "#/components/schemas/SchemaFieldFlagsType"
        minUsage:
          type: number
        maxUsage:
          type: number

    SchemaGroup:
      type: object
      description: Gruppen-Definition innerhalb eines Schema-Dokuments (kind=group)
      required:
        - kind
        - order
        - dataStructure
        - formProperties
        - minUsage
        - maxUsage
        - collectionType
        - items
      properties:
        kind:
          type: string
          enum:
            - group
        order:
          type: number
        dataStructure:
          type: object
          required:
            - itemName
          properties:
            itemName:
              type: string
        formProperties:
          type: object
          required:
            - label
          properties:
            label:
              $ref: "#/components/schemas/MultilingualTextType"
        itemFlags:
          $ref: "#/components/schemas/SchemaGroupFlags"
        minUsage:
          type: number
        maxUsage:
          type: number
        collectionType:
          type: string
          enum:
            - array
            - map
        items:
          type: array
          items:
            $ref: "#/components/schemas/SchemaItem"

    SchemaItem:
      oneOf:
        - $ref: "#/components/schemas/SchemaField"
        - $ref: "#/components/schemas/SchemaGroup"
      discriminator:
        propertyName: kind
        mapping:
          field: "#/components/schemas/SchemaField"
          group: "#/components/schemas/SchemaGroup"

    SchemaParentRestrictions:
      type: object
      required:
        - whitelist
        - blacklist
      properties:
        whitelist:
          type: array
          items:
            type: string
        blacklist:
          type: array
          items:
            type: string

    SchemaStyle:
      type: object
      required:
        - treeIcon
      properties:
        treeIcon:
          type: string
          description: SVG oder Icon-Markup für Baum-/Tabellenansicht

    SchemaDocument:
      type: object
      description: >
        Schema-Dokument (INTERNAL, ELEMENT oder DOCKPART). Entspricht dem MobX SchemaModel /
        ConnectSchemaModel. Die Meta-Schema-Definition SCHEMA beschreibt die Bearbeitung
        solcher Dokumente im Schema Manager.
      required:
        - id
        - baseType
        - type
        - name
        - description
        - order
        - parent
        - style
        - items
      properties:
        id:
          type: string
          example: SCHEMA
        baseType:
          $ref: "#/components/schemas/SchemaBaseType"
        type:
          type: string
          example: SCHEMA
        name:
          $ref: "#/components/schemas/MultilingualTextType"
        description:
          $ref: "#/components/schemas/MultilingualTextType"
        order:
          type: number
        parent:
          $ref: "#/components/schemas/SchemaParentRestrictions"
        style:
          $ref: "#/components/schemas/SchemaStyle"
        items:
          type: array
          description: Feld- und Gruppen-Definitionen (Formular-Metadaten)
          items:
            $ref: "#/components/schemas/SchemaItem"

    SchemaDocumentList:
      type: array
      items:
        $ref: "#/components/schemas/SchemaDocument"

    SchemaModel:
      description: Alias für SchemaDocument (Legacy-Name in älteren Spec-Versionen)
      allOf:
        - $ref: "#/components/schemas/SchemaDocument"

    ElementSchemaList:
      description: Alias für SchemaDocumentList (Legacy-Pfad /config/element-schemas)
      allOf:
        - $ref: "#/components/schemas/SchemaDocumentList"

    FilterruleType:
      type: string

    GroupItem:
      required:
        - id
        - definition
        - parentIdRef
      properties:
        id:
          type: string
        definition:
          $ref: "#/components/schemas/DefinitionType"
        parentIdRef:
          type: string
        elementIdRef:
          type: array
          items: 
            $ref: "#/components/schemas/ElementRefType"
        filterRules:
          type: array
          items:
            $ref: "#/components/schemas/FilterruleType"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentType"
        properties:
          type: object
          required:
            - responsibles
            - notations
            - style
          properties:
            responsibles:
              type: array
              items:
                $ref: "#/components/schemas/ResponsibleType"
            notation:
              type: array
              items:
                $ref: "#/components/schemas/NotationType"
            style:
              type: object
              properties:
                bgColor:
                  type: string
                  example: "#FF6611"
                graph:
                  type: object
                  properties:
                    layout:
                      type: string
                      example: "LOCALE"

        settings:
          type: object
          additionalProperties: true
          description: Any kind oj JSON data.

    GroupList:
      type: array
      items:
        $ref: "#/components/schemas/GroupItem"

    LoginResponse:
      required:
        - id
        - xxx
      properties:
        id:
          type: integer
          format: int64
        xxx:
          type: string

    NotationType:
      required:
        - id
        - xxx
      properties:
        id:
          type: integer
          format: int64
        xxx:
          type: string

    ResponsibleType:
      required:
        - type
        - name
        - email
      properties:
        type:
          type: string
        name:
          type: string
        email:
          type: string

    ViewItem:
      type: object
      required:
        - id
        - definition
        - filterRules
        - attachments
        - properties
        - settings
      properties:
        id:
          type: string
        definition:
          $ref: "#/components/schemas/DefinitionType"
        filterRules:
          type: array
          items:
            $ref: "#/components/schemas/FilterruleType"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentType"
        properties:
          type: object
          required:
            - responsibles
            - notations
            - style
          properties:
            responsibles:
              type: array
              items:
                $ref: "#/components/schemas/ResponsibleType"
            notations:
              type: array
              items:
                $ref: "#/components/schemas/NotationType"
            style:
              type: object
              properties:
                bgColor:
                  type: string
                  example: "#FF6611"
                graph: 
                  type: object
                  properties:
                    layout: 
                      type: string
                      example: "MAIN"
        settings:
          type: object
          additionalProperties: true
          description: Any kind oj JSON data.

    ViewList:
      type: array
      items:
        $ref: "#/components/schemas/ViewItem"
  
    Error:
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string