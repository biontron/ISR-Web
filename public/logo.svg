<svg width="470px" height="350px" viewBox="0 0 470 350" xmlns="http://www.w3.org/2000/svg">
    <!-- Defining gradients for the background and elements -->
    <defs>
      <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#f0f8ff; stop-opacity:1" /> <!-- Lighter sky color -->
        <stop offset="100%" style="stop-color:#a8c8e4; stop-opacity:1" />
      </linearGradient>
      <linearGradient id="grassGradient" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" style="stop-color:#b4cf80; stop-opacity:1" />
        <stop offset="100%" style="stop-color:#8fb63f; stop-opacity:0.8" />
      </linearGradient>
      <linearGradient id="boxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#FFFFFF; stop-opacity:1" />
        <stop offset="100%" style="stop-color:#DDDDDD; stop-opacity:1" />
      </linearGradient>
      <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%"> <!-- Common gradient for lines -->
        <stop offset="0%" style="stop-color:#2891ca; stop-opacity:1" />
        <stop offset="100%" style="stop-color:#093758; stop-opacity:1" />
      </linearGradient>
    </defs>
  
    <!-- Background with gradient -->
    <rect fill="url(#skyGradient)" x="0" y="0" width="471" height="145"/>
    <rect fill="url(#grassGradient)" x="0" y="145" width="471" height="185"/> <!-- Extended grass background -->

    <!-- Horizon line -->
    <line x1="0" y1="145" x2="471" y2="145" stroke="#FFFFFF" stroke-width="2"/>

    <g>
        <!-- Connectors -->
        <path d="M215.5,170 v65 h10 v65" stroke="url(#lineGradient)" stroke-width="6" fill="none"/>
        <path d="M215.5,170 v30 h-120 v30" stroke="url(#lineGradient)" stroke-width="6" fill="none"/>
        <path d="M215.5,170 v30 h120 v30" stroke="url(#lineGradient)" stroke-width="6" fill="none"/>

        <!-- Center rectangle -->
        <rect fill="url(#boxGradient)" x="185.5" y="100" width="60" height="70" stroke="url(#lineGradient)" stroke-width="6"/>
        
        <!-- Left rectangle -->
        <rect fill="url(#boxGradient)" x="65.5" y="230" width="60" height="70" stroke="url(#lineGradient)" stroke-width="6"/>
        
        <!-- Right rectangle -->
        <rect fill="url(#boxGradient)" x="305.5" y="230" width="60" height="70" stroke="url(#lineGradient)" stroke-width="6"/>
        
        <!-- Bottom rectangle -->
        <rect fill="url(#boxGradient)" x="185.5" y="230" width="60" height="70" stroke="url(#lineGradient)" stroke-width="6"/>

    </g>
</svg>
